# GitHub.com/PiercingXX - better-mac
# macOS overrides, included at the end of the piercing-dots kitty.conf

# kitty on macOS sizes fonts at 72 dpi; Linux's 10pt is about 13pt here
font_size 13.0

# Blur behind background_opacity 0.65, which Hyprland's blur did on Linux
background_blur 20

# AeroSpace tiles the window; drop only the title bar
hide_window_decorations titlebar-only

# Left Option is Super for AeroSpace; right Option is Alt for nvim/tmux/yazi
macos_option_as_alt right

# The skippy bell hook only exists on the Linux desktop
command_on_bell none

macos_quit_when_last_window_closed yes
